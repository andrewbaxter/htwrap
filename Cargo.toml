[package]
name = "htwrap"
version = "0.16.1"
edition = "2021"
description = "Framework-less Hyper client and server"
readme = "readme.md"
repository = "https://github.com/andrewbaxter/htwrap"
license = "ISC"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
loga = "0.5"
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12", "logging"] }
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
hickory-resolver = "0.26"
rand = "0.10"
async-stream = "0.3"
async-trait = "0.1"
sha2 = "0.11"
flowcontrol = "0.2"
format-bytes = "0.3"

[features]
default = ["ring"]
ring = ["rustls/ring", "tokio-rustls/ring", "hyper-rustls/ring"]
aws-lc-rs = ["rustls/aws-lc-rs", "tokio-rustls/aws-lc-rs", "hyper-rustls/aws-lc-rs"]

[lints.clippy]
all = "allow"
